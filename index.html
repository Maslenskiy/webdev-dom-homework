<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul id="comments" class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
          id="input-name"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
          id="input-comment"
        ></textarea>
        <div class="add-form-row">
          <button id="form-button" class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    const inputNameEllement = document.getElementById('input-name');
    const inputComment = document.getElementById('input-comment');
    const formButton = document.getElementById('form-button');
    const listComments = document.getElementById('comments');
  
    function getDate (){
     const date = new Date()
     const day = String(date.getDate()).padStart(2, '0');
     const month = String(date.getMonth() + 1).padStart(2, '0'); 
     const year = String(date.getFullYear()).slice(-2); 
     const hours = String(date.getHours()).padStart(2, '0');
     const minutes = String(date.getMinutes()).padStart(2, '0');

    return `${day}.${month}.${year} ${hours}:${minutes}`;
    }


    function validationInputs(){
      const name = inputNameEllement.value.trim();
      const comment = inputComment.value.trim();

      // Сбрасываем предыдущие ошибки
     inputNameEllement.classList.remove('error');
      inputComment.classList.remove('error');
      let hasError = false;

      if (!name) {
        inputNameEllement.classList.add('error');
        hasError = true;
      }

      if (!comment) {
        inputComment.classList.add('error');
        hasError = true;
      }

      if (hasError) {
          alert('Пожалуйста, заполните все поля.');
          return;

      } else{
        renderList()
        inputNameEllement.value = '';
        inputComment.value = '';
      } 
    }


    function renderList(){
        const liEllement = document.createElement(`li`);

        liEllement.innerHTML = `<li class="comment">
           <div class="comment-header">
             <div>${inputNameEllement.value}</div>
             <div>${getDate()}</div>
           </div>
           <div class="comment-body">
             <div class="comment-text">
               ${inputComment.value}
             </div>
           </div>
          <div class="comment-footer">
             <div class="likes">
              <span class="likes-counter">0</span>
               <button class="like-button"></button>
             </div>
           </div>
         </li>`
        listComments.appendChild(liEllement)

      }

    formButton.addEventListener('click', ()=>{  
      validationInputs()
    })

  </script>
</html>
